<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PolicyCenter HazardHub Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Palette sampled from the demo video and reference screenshot */
:root{
  color-scheme:light;
  --nav:#1d2637; --nav-sec:#394b6c; --nav-tools:#31405a; --nav-toolitems:#080b12; --nav-line:#05070c;
  --nav-text:#d9dee7; --nav-sectext:#9db2cf; --nav-dim:#5f6674;
  --top:#44577d; --top-on:#566f9e; --top-text:#e3e9f3; --actions:#407ba1;
  --btn:#407ba1; --btn-h:#336a8f;
  --page:#f1f2f6; --card:#ffffff; --line:#dfe2e7; --rule:#e2e4e8;
  --text:#3c3f45; --label:#6f727a; --muted:#8b8e95; --title:#55585e;
  --link:#5d86b8; --sel-text:#2f6c98; --sel-border:#5d93bb; --field-border:#c8ced3;
  --rowsel:#dcf0fa; --req:#dca26a;
  --high:#d9483b; --med:#f2b52c; --low:#5fae3e; --info:#a3abb3; --hint:#f5b400;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Arial,sans-serif;font-size:13px;color:var(--text);background:var(--page)}
button{font:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid #5fb3e6;outline-offset:1px}
u{text-underline-offset:2px}

.app{display:grid;grid-template-columns:180px 1fr;grid-template-rows:auto 1fr;height:100%;overflow:hidden}
.app.collapsed{grid-template-columns:0 1fr}
.logo{background:var(--nav);color:#fff;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:17px;white-space:nowrap;overflow:hidden;height:40px}
.logo sup{font-size:8px;vertical-align:8px}
.topbar{background:var(--top);display:flex;align-items:stretch;padding:0 6px 0 16px;min-width:0;height:40px;align-self:start}
.menus{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.menus::-webkit-scrollbar{display:none}
.tm{display:flex;align-items:center;color:var(--top-text);white-space:nowrap;padding:0 2px}
.tm.active{background:var(--top-on)}
.tm > button{background:none;border:0;color:inherit;padding:0 7px;height:100%}
.tm > button:hover{background:rgba(255,255,255,.08)}
.tm .car{display:flex;align-items:center;gap:6px;padding:0 6px 0 0}
.tm .car::before{content:"";width:1px;height:18px;background:rgba(255,255,255,.55)}
.tm .car svg{margin-left:2px}
.tbright{display:flex;align-items:center;gap:8px;margin-left:8px}
.tbright input{width:130px;border:0;border-radius:1px;padding:4px 6px;font:inherit;font-size:11px;background:#fff;color:#333}
.iconbtn{background:none;border:0;color:#fff;padding:4px;display:flex}

.dropdown{position:fixed;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.18);min-width:170px;z-index:50;padding:4px 0}
.dropdown button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 14px;color:var(--text)}
.dropdown button:hover{background:var(--rowsel)}

.side{background:var(--nav);color:var(--nav-text);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.actionsbar{background:var(--actions);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 8px;height:28px;border:0;width:100%;text-align:left}
.actionsbar span:first-child{display:flex;align-items:center;gap:6px}
.sub-title{padding:10px 4px 6px}
.sub-title b{display:block;font-size:14px;font-weight:400;color:#fff}
.sub-title small{color:#8a909b;font-size:10px}
.timeline{position:relative;list-style:none;margin:0;padding:0}
.timeline::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--nav-line);z-index:1}
.navsec{display:flex;justify-content:space-between;align-items:center;background:var(--nav-sec);padding:6px 10px 6px 20px;border:0;width:100%;color:var(--nav-sectext);text-align:left;border-top:1px solid #2b3850}
.navsec .arr{color:#fff;font-size:9px}
.navlink{display:flex;align-items:center;width:100%;border:0;background:none;color:var(--nav-text);text-align:left;padding:6px 10px 6px 25px;position:relative;font-size:13px}
.navlink.lvl0{padding-left:20px}
.navlink::before{content:"";position:absolute;left:4px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--nav-line);z-index:2}
.navlink.visited::before{background:#c9ced6}
.navlink.sel{background:var(--nav-sec);color:#fff}
.navlink.sel::before{left:2px;width:12px;height:12px;margin-top:-6px;background:#fff;box-shadow:inset 0 0 0 3px #fff, inset 0 0 0 5px var(--nav-sec)}
.navlink:hover:not(.disabled):not(.sel){background:rgba(255,255,255,.05)}
.navlink.disabled{color:var(--nav-dim);cursor:default}
.toolsec{display:flex;justify-content:space-between;align-items:center;background:var(--nav-tools);color:#fff;border:0;width:100%;padding:7px 12px 7px 8px;margin-top:10px;text-align:left}
.toolsec span:first-child{display:flex;align-items:center;gap:6px}
.toolsec .arr{font-size:9px}
.tool-list{list-style:none;margin:0;padding:0;background:var(--nav-toolitems)}
.tool-list li+li{border-top:1px solid #1e2533}
.navlink.tool{padding:6px 10px 6px 20px;gap:7px;color:#e6e8ec}
.navlink.tool::before{display:none}
.side-foot{margin-top:auto;display:flex;justify-content:flex-end;padding:8px 10px;border-top:1px solid #151c29}
.side-foot button{background:none;border:0;color:#d9dee7;font-size:15px;line-height:1}
.expand-nav{position:fixed;left:6px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--nav);color:#fff;border:0;border-radius:2px;padding:4px 8px;display:none}
.app.collapsed .expand-nav{display:block}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--page)}
.infobar{display:flex;align-items:center;gap:18px;padding:0 16px;height:30px;background:#fff;border-bottom:1px solid var(--rule);flex-wrap:nowrap;overflow-x:auto;font-size:12.5px;color:#3a3a3a;flex:none}
.infobar b{font-weight:700;color:#222}
.infobar span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pagehead{display:flex;align-items:center;gap:12px;padding:5px 12px 5px 16px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--rule);flex:none}
.pagehead h1{font-size:19px;font-weight:400;margin:0;color:var(--title)}
.pagehead .ret{font-size:12px}
.pagehead .acts{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.content{flex:1;overflow:auto;padding:10px 16px 40px 22px}

.btn{background:var(--btn);color:#fff;border:0;border-radius:2px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--btn-h)}
.btn[disabled]{background:#b7c2cb;cursor:default;color:#f4f6f8}
.btn.sm{padding:3px 8px;font-size:12px}
.btn .spin{display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.btn .spin{animation:none}}

.tabs{display:flex;flex-wrap:wrap;margin:8px 0 0;position:relative;z-index:1}
.tab{background:#fff;border:1px solid var(--line);border-left-width:0;padding:5px 11px;color:var(--text);font-size:12.5px;margin-bottom:-1px}
.tab:first-child{border-left-width:1px}
.tab:hover{background:#f7f8fa}
.tab.on{font-weight:700;border-bottom-color:#fff}
.tabs + .box, .tabs + .highlights{margin-top:0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}

.box{border:1px solid var(--line);background:var(--card);margin:8px 0;max-width:1100px}
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:560px}
.grid th{font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;color:#444}
.grid th.sortable{cursor:pointer;user-select:none}
.grid th .srt{font-size:7px;color:#9a9da3;margin-left:4px;letter-spacing:-1px}
.grid td{padding:6px 8px;border-bottom:1px solid #eef0f2;vertical-align:middle}
.grid tr.clickrow{cursor:pointer}
.grid tr.clickrow:hover td{background:#f3f9fd}
.grid tr.selrow td{background:var(--rowsel)}
.grid .num{text-align:center}
.grid .empty{text-align:center;color:var(--muted);padding:14px}
.gridtools{display:flex;justify-content:flex-end;padding:3px 4px 0}
.gridtools button{background:none;border:0;color:#444;padding:2px}

.stat{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;line-height:1;flex:none}
.stat.high{background:var(--high)}
.stat.med{background:var(--med)}
.stat.low{background:var(--low)}
.stat.info{background:var(--info)}
.statcell{display:flex;align-items:center;gap:14px}

.hhwrap{background:var(--card);border:1px solid var(--line);padding:0 10px 10px;max-width:1100px}
.highlights{background:var(--page);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 24px;padding:10px 12px;border:1px solid var(--line)}
.kv{margin:0;display:grid;grid-template-columns:125px 1fr;gap:5px 8px;align-content:start}
.kv dt{color:var(--label)}
.kv dd{margin:0;color:var(--text)}
.kv .hd{grid-column:1/-1;font-weight:700;min-height:18px;color:var(--text)}

.split{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;max-width:1100px}
.split > .box{flex:1 1 440px;margin:0}
.chartbox{flex:0 0 230px;border:1px solid var(--line);padding:10px;background:var(--card)}
.chartbox h3{font-size:14px;font-weight:400;margin:0 0 8px;color:var(--title)}
.chart{display:flex;align-items:center;gap:14px}
.legend{list-style:none;margin:0;padding:0;font-size:11.5px}
.legend li{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend i{width:10px;height:7px;display:inline-block}
.boxhead{display:flex;align-items:center;gap:12px;padding:8px 8px 4px}
.boxhead h3{font-size:14px;font-weight:400;margin:0;color:var(--title)}
.boxhead .gridtools{margin-left:auto}

.rc{border:1px solid var(--line);margin-top:12px;padding:10px 12px;background:var(--card)}
.rc h3{font-size:15px;font-weight:400;margin:0 0 8px;color:var(--title)}
.rc .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.rc .kv{grid-template-columns:130px 1fr;background:var(--page);padding:6px 6px 10px}
.rc .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}

.form{display:grid;grid-template-columns:minmax(0,520px) minmax(0,420px);gap:0}
.form .col{padding:4px 18px 10px 10px}
.form .col:first-child{border-right:1px solid var(--rule);padding-left:10px}
.form .col:last-child{padding-left:20px}
.form .col:last-child .frow{grid-template-columns:160px minmax(0,215px)}
.frow{display:grid;grid-template-columns:160px minmax(0,300px);align-items:center;min-height:27px;gap:10px;margin:0 0 8px}
.frow > label,.frow > .lb{color:var(--label)}
.frow > .lb.strong{color:#55585e;font-weight:600}
.fsec{font-weight:600;margin:12px 0 10px;color:#4a4d53}
.fsec:first-child{margin-top:6px}
.rule{border-top:1px solid var(--rule);margin:12px -10px 12px}
.val{color:var(--text)}
.inp{position:relative;display:flex;align-items:center}
.inp input,.inp select,.inp textarea{width:100%;border:1px solid var(--field-border);border-radius:1px;padding:5px 8px;font:inherit;font-size:13px;background:#fff;color:var(--text)}
.inp input::placeholder{color:#a5a8ad}
.inp select{appearance:none;padding-right:26px;color:var(--sel-text);border-color:var(--sel-border)}
.inp .sel-car{position:absolute;right:9px;pointer-events:none;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--sel-text)}
.inp.req::before{content:"*";color:var(--req);position:absolute;left:-11px;top:-3px;font-size:15px}
.inp.money .pre{border:1px solid var(--field-border);border-right:0;background:#fff;padding:5px 8px;color:var(--text)}
.ico{border:1px solid var(--field-border);background:#fff;color:#3d7298;padding:0;margin-left:6px;display:flex;align-items:center;justify-content:center;width:30px;height:29px;flex:none;border-radius:3px}
.ico.cal{margin-left:0;border-left:0;border-radius:0 2px 2px 0}
.ico.chg{background:var(--btn);border:0;color:#fff;width:24px;height:22px;border-radius:2px}
.inp textarea{min-height:120px;resize:vertical}
.w-mid{max-width:none}
.chgto{display:flex;justify-content:space-between;align-items:center;color:#4a4d53}

.placeholder{max-width:560px;margin:20px 0;padding:18px;border:1px dashed #c9cdd3;color:var(--muted);background:#fff}
.placeholder b{color:var(--text);display:block;margin-bottom:6px;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2637;color:#fff;padding:9px 16px;border-radius:3px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}

.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal{background:#fff;width:min(480px,100%);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal header{background:var(--top);color:#fff;padding:8px 12px;font-weight:600;display:flex;justify-content:space-between}
.modal header button{background:none;border:0;color:#fff;font-size:16px;line-height:1}
.modal .mb{padding:14px 12px 4px 20px;background:var(--page)}
.modal footer{display:flex;justify-content:flex-end;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}

.play{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:#fff;border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.18);border-radius:4px;padding:8px 10px;display:flex;gap:10px;align-items:center;font-size:12px}
.play label{display:flex;gap:5px;align-items:center;cursor:pointer}
.play button{background:none;border:1px solid var(--line);border-radius:2px;padding:2px 8px;color:var(--text)}

body.hints .btn:not([disabled]), body.hints .navlink:not(.disabled), body.hints .tab, body.hints .rlink,
body.hints tr.clickrow td:first-child, body.hints .tm > button, body.hints th.sortable, body.hints .extlink, body.hints .ret a, body.hints .ico{
  outline:2px dashed var(--hint);outline-offset:1px
}

@media (max-width:760px){
  .app{grid-template-columns:0 1fr}
  .app.mobile-open{grid-template-columns:180px 1fr}
  .app .expand-nav{display:block}
  .app.mobile-open .expand-nav{display:none}
  .logo{padding:0}
  .form{grid-template-columns:1fr}
  .form .col:first-child{border-right:0}
  .frow{grid-template-columns:120px 1fr}
  .highlights{grid-template-columns:1fr}
  .rc .cols{grid-template-columns:1fr}
  .tbright input{display:none}
  .play{left:12px;right:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2h14v4H6v6h6v-2H9V8h7v8H2z" fill="#fff"/></svg>
    <span>PolicyCenter<sup>TM</sup></span>
  </div>
  <div class="topbar">
    <nav class="menus" id="menus" aria-label="Main menu"></nav>
    <div class="tbright">
      <button class="iconbtn" aria-label="Bookmarks" data-toast="Bookmarks opened"><svg width="13" height="14" viewBox="0 0 13 14"><path d="M1 0h11v14l-5.5-4L1 14z" fill="currentColor"/></svg></button>
      <button class="iconbtn" aria-label="Settings" data-toast="Settings opened"><svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
      <input type="search" placeholder="Go to (Alt+/)" aria-label="Go to" id="goto">
    </div>
  </div>

  <aside class="side" id="side" aria-label="Submission navigation"></aside>

  <main class="main">
    <div class="infobar">
      <span><svg width="13" height="13" viewBox="0 0 14 14"><path d="M7 0v8M3 5l4 4 4-4M1 10v3h12v-3" stroke="currentColor" stroke-width="2" fill="none"/></svg>Submission (Draft)</span>
      <span><svg width="12" height="13" viewBox="0 0 12 14"><rect x="1" y="1" width="10" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 4h6M3 7h6M3 10h6" stroke="currentColor"/></svg>Commercial Property</span>
      <span>Effective: 09/09/2022</span>
      <span>Primary: <b>AEA llc</b></span>
      <span>Account: <a class="extlink" data-toast="Account 0593576288 opened">0593576288</a></span>
      <span>Underwriter: <b>Steve Smith</b></span>
    </div>
    <div class="pagehead" id="pagehead"></div>
    <div class="content" id="content"></div>
  </main>
  <button class="expand-nav" id="expandNav" aria-label="Show navigation">&raquo;</button>
</div>

<div class="play" role="region" aria-label="Playground controls">
  <label><input type="checkbox" id="hintToggle"> Show clickable areas</label>
  <button id="resetBtn">Reset</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function statIcon(s){
  if(s==="high")return '<span class="stat high" aria-label="High concern">!</span>';
  if(s==="med")return '<span class="stat med" aria-label="Medium concern"></span>';
  if(s==="info")return '<span class="stat info" aria-label="Info only">i</span>';
  return '<span class="stat low" aria-label="Low concern"><svg width="8" height="8" viewBox="0 0 10 10"><path d="M1 5l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/></svg></span>';
}
function counts(list){var c={info:0,low:0,med:0,high:0};list.forEach(function(x){c[x.status]++});return c;}
function pie(c,size){
  var parts=[["info","var(--info)"],["low","var(--low)"],["med","#ef9a47"],["high","var(--high)"]];
  var total=c.info+c.low+c.med+c.high, r=size/2, a=-Math.PI/2, out="";
  parts.forEach(function(p){
    var v=c[p[0]]; if(!v)return;
    var ang=v/total*Math.PI*2;
    if(v===total){out+='<circle cx="'+r+'" cy="'+r+'" r="'+r+'" fill="'+p[1]+'"/>';return;}
    var x1=r+r*Math.cos(a),y1=r+r*Math.sin(a),x2=r+r*Math.cos(a+ang),y2=r+r*Math.sin(a+ang);
    out+='<path d="M'+r+' '+r+' L'+x1+' '+y1+' A'+r+' '+r+' 0 '+(ang>Math.PI?1:0)+' 1 '+x2+' '+y2+' Z" fill="'+p[1]+'"/>';
    a+=ang;
  });
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Risk factor mix">'+out+'</svg>';
}

    h+='<div class="box">'+gridTools()+'<div class="scroll"><table class="grid"><thead><tr><th style="width:80px"></th><th>Primary <span class="srt">&#9650;&#9660;</span></th><th>Loc. # <span class="srt">&#9650;&#9660;</span></th><th>Non Specific <span class="srt">&#9650;&#9660;</span></th><th>Location Code <span class="srt">&#9650;&#9660;</span></th><th>Location Name <span class="srt">&#9650;&#9660;</span></th><th>Address <span class="srt">&#9650;&#9660;</span></th><th>Up To Date <span class="srt">&#9650;&#9660;</span></th></tr></thead><tbody>';
    LOCS.forEach(function(l,i){
      h+='<tr class="clickrow'+(S.selLoc===i?" selrow":"")+'" data-loc="'+i+'" tabindex="0"><td>'+reqBtn("loc"+i)+'</td><td class="num">'+(l.primary?"X":"")+'</td><td class="num">'+l.n+'</td><td></td><td class="num">'+l.code+'</td><td>'+esc(l.name)+'</td><td>'+esc(l.addr)+'</td><td>Yes</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  h+='<div class="tabs" style="margin-top:10px"><button class="tab'+(S.detTab==="Details"?" on":"")+'" data-dettab="Details">Details</button><button class="tab'+(S.detTab==="History"?" on":"")+'" data-dettab="History">History</button></div>';
  if(S.detTab==="History"){
    h+='<div class="box scroll"><table class="grid"><thead><tr><th>Requested</th><th>Solution</th><th>Location</th><th>Requested By</th><th>Result</th></tr></thead><tbody>'+
      S.history.map(function(r){return '<tr><td>'+r.date+'</td><td>'+esc(r.sol)+'</td><td>'+esc(r.loc)+'</td><td>'+r.user+'</td><td>'+r.result+'</td></tr>'}).join("")+'</tbody></table></div>';
    return h;
  }
  h+='<div class="highlights">'+
    '<dl class="kv"><dt class="hd" style="color:var(--text)">Risk Highlights</dt><dt>Property Elevation</dt><dd>'+loc.elev+'</dd><dt>Distance to Coast</dt><dd>'+loc.coast+'</dd><dt>Slope</dt><dd>'+loc.slope+'</dd></dl>'+
    '<dl class="kv"><dt class="hd"><a class="extlink" data-act="gmapsLoc">View in Google Maps</a></dt><dt>Geocoding Accuracy</dt><dd>'+loc.geo+'</dd><dt>FEMA Flood Zone</dt><dd>'+loc.fema+'</dd><dt>Fire Protection Class</dt><dd>'+loc.fpc+'</dd></dl>'+
    '<dl class="kv" style="grid-template-columns:165px 1fr"><dt class="hd"><a class="extlink" data-act="fema">View FEMA Flood Map</a></dt><dt>Hydrants within 1000 feet</dt><dd>'+loc.hyd+'</dd><dt>Fire Stations within 5 miles</dt><dd>'+loc.fs+'</dd><dt>Distance to Fire Station</dt><dd>'+loc.dist+'</dd></dl>'+
  '</div>';

  h+='<div class="split" style="margin-top:12px"><div class="box"><div class="boxhead"><h3>Most Relevant Risk Factors ('+loc.rel.length+' of '+FACTORS.length+')</h3><button class="btn" data-nav="allFactors">View All Risk Factors ('+FACTORS.length+')</button>'+gridTools()+'</div>'+
    '<div class="scroll"><table class="grid"><thead><tr>'+th("Risk Status","status",S.sortRel,"rel")+th("Risk Name","name",S.sortRel,"rel")+th("Risk Description","desc",S.sortRel,"rel")+'</tr></thead><tbody>'+factorRows(sorted(loc.rel,S.sortRel))+'</tbody></table></div></div>'+
    '<div class="chartbox"><h3>RiskFactorChartInfo</h3><div class="chart">'+pie(c,96)+legend(c)+'</div></div></div>';

  var r=loc.rc;
  h+='<section class="rc"><h3>Replacement Cost</h3><div class="cols">'+
    '<dl class="kv"><dt>Replacement Cost</dt><dd>'+r.cost+'</dd><dt>Debris Removal</dt><dd></dd><dt>Final RCV</dt><dd></dd><dd class="sep"></dd><dt>Architect Fees And Permits</dt><dd></dd><dt>House Materials And Labor</dt><dd></dd><dt>Overhead</dt><dd></dd><dt>Profit</dt><dd></dd><dd class="sep"></dd><dt>Year Built</dt><dd>'+r.year+'</dd><dt>Number Of Stories</dt><dd>'+r.stories+'</dd><dt>Square Footage</dt><dd>'+r.sqft+'</dd></dl>'+
    '<dl class="kv"><dt>Architectural Style</dt><dd>'+r.style+'</dd><dt>Construction Quality</dt><dd>'+r.quality+'</dd><dt>Physical Shape</dt><dd>'+r.shape+'</dd><dt>Construction Type</dt><dd>'+r.ctype+'</dd><dt>Primary Exterior</dt><dd>'+r.ext+'</dd><dd class="sep"></dd><dt>Primary Roof Covering</dt><dd>'+r.roof+'</dd><dt>Roof Configuration</dt><dd></dd><dt>Foundation Type</dt><dd></dd><dt>Locale</dt><dd>'+r.locale+'</dd><dt>Slope Of Site</dt><dd></dd></dl>'+
  '</div></section>';
  return h;
}
function reqBtn(key){
  if(S.requested[key]==="busy") return '<button class="btn sm" disabled><span class="spin"></span>Request</button>';
  return '<button class="btn sm" data-req="'+key+'">Request</button>';
}

function pageAllFactors(){
  head("Risk Factors",["Return to Risk Analysis","riskAnalysis"],null);
  var c=counts(FACTORS);
  return '<div class="split" style="max-width:1100px;margin-top:6px"><div class="box" style="flex:1 1 560px"><div class="boxhead"><h3>All Risk Factors ('+FACTORS.length+')</h3>'+gridTools()+'</div><div class="scroll"><table class="grid"><thead><tr>'+
    th("Risk Status","status",S.sortAll,"all")+th("Risk Name","name",S.sortAll,"all")+th("Risk Description","desc",S.sortAll,"all")+'</tr></thead><tbody>'+factorRows(sorted(FACTORS,S.sortAll))+'</tbody></table></div></div>'+
    '<div class="chartbox"><h3>Risk Factor Statistics ('+FACTORS.length+')</h3><div class="chart">'+pie(c,96)+legend(c)+'</div></div></div>';
}
function pageFactorDetail(){
  var x=f(S.factor)||FACTORS[0];
  var back = S.factorFrom==="riskAnalysis" ? ["Return to Risk Analysis","riskAnalysis"] : ["Return to Risk Factors","allFactors"];
  head(esc(x.name),back,null);
  var rows = DETAILS[x.name] || [["HazardHub score (A-F)",x.grade],["Risk description",x.desc],["Data source","HazardHub"],["Last refreshed","09/08/2022"]];
  return '<div class="box" style="max-width:540px;padding:6px 10px;display:flex;gap:10px;align-items:center;font-weight:600">'+statIcon(x.status)+'<span>'+x.grade+'</span><span>'+esc(x.desc)+'</span></div>'+
   '<div class="box scroll" style="max-width:540px"><table class="grid" style="min-width:420px"><thead><tr><th>Name</th><th>Description</th></tr></thead><tbody>'+
   rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'}).join("")+'</tbody></table></div>';
}
function pagePlaceholder(title){
  head(title,null,stdActs(S.page!=="policyInfo"));
  return '<div class="placeholder"><b>'+title+'</b>This screen is not part of the HazardHub demo. Use Policy Info, Buildings and Locations, or Risk Analysis to explore.</div>';
}

var TITLES={blankets:"Blankets",manuscript:"Manuscript Endorsements",modifiers:"Modifiers",policyReview:"Policy Review"};
function render(){
  var app=document.getElementById("app");
  app.classList.toggle("collapsed",S.navCollapsed);
  renderSide();
  var c;
  if(S.page==="policyInfo")c=pagePolicyInfo();
  else if(S.page==="buildings")c=pageBuildings();
  else if(S.page==="riskAnalysis")c=pageRisk();
  else if(S.page==="allFactors")c=pageAllFactors();
  else if(S.page==="factorDetail")c=pageFactorDetail();
  else if(S.page.indexOf("tool:")===0)c=pagePlaceholder(S.page.slice(5));
  else c=pagePlaceholder(TITLES[S.page]||S.page);
  document.getElementById("content").innerHTML=c;
}
function go(page){S.page=page;render();document.getElementById("content").scrollTop=0;if(window.innerWidth<=760)document.getElementById("app").classList.remove("mobile-open");}

/* ---------- modal & dropdown ---------- */
function closeDrop(){var d=document.querySelector(".dropdown");if(d)d.remove();}
function dropdown(anchor,items,handler){
  closeDrop();
  var r=anchor.getBoundingClientRect(),d=document.createElement("div");
  d.className="dropdown";d.setAttribute("role","menu");
  d.innerHTML=items.map(function(t,i){return '<button role="menuitem" data-i="'+i+'">'+esc(t)+'</button>'}).join("");
  document.body.appendChild(d);
  var left=Math.min(r.left,window.innerWidth-d.offsetWidth-8);
  d.style.left=Math.max(8,left)+"px";d.style.top=(r.bottom+2)+"px";
  d.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;handler(items[+b.dataset.i]);closeDrop();});
  var first=d.querySelector("button");if(first)first.focus();
}
function modal(title,body,okLabel,onOk){
  var bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header><span>'+esc(title)+'</span><button aria-label="Close" data-x>&times;</button></header><div class="mb">'+body+'</div><footer><button class="btn" data-x style="background:#8795a1">Cancel</button><button class="btn" data-ok>'+esc(okLabel)+'</button></footer></div>';
  document.body.appendChild(bg);
  function close(){bg.remove();}
  bg.addEventListener("click",function(e){
    if(e.target===bg||e.target.closest("[data-x]"))close();
    if(e.target.closest("[data-ok]")){if(onOk(bg)!==false)close();}
  });
  var i=bg.querySelector("input,select,textarea,button[data-ok]");if(i)i.focus();
}

/* ---------- actions ---------- */
function now(){var d=new Date();return (d.getMonth()+1+"").padStart(2,"0")+"/"+(d.getDate()+"").padStart(2,"0")+"/"+d.getFullYear()+" "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
function doRequest(key){
  S.requested[key]="busy";render();
  setTimeout(function(){
    S.requested[key]="done";
    var sol = key==="cas" ? "HazardHub Casualty" : "HazardHub Property (Commercial)";
    var loc = key.indexOf("loc")===0 ? LOCS[+key.slice(3)].name : "All locations";
    S.history.unshift({date:now(),sol:sol,user:"Steve Smith",loc:loc,result: key==="cas"?"No casualty data for this product":"Success"});
    render();
    toast(key==="cas" ? "HazardHub Casualty returned no results for this line" : sol+" data refreshed"+(key.indexOf("loc")===0?" for "+loc:""));
  },1300);
}
var ACTIONS={
  actions:function(el){dropdown(el,["New Note","New Document","New Activity","Withdraw Transaction"],function(t){toast(t+" selected");});},
  toggleContract:function(){S.contractOpen=!S.contractOpen;render();},
  toggleTools:function(){S.toolsOpen=!S.toolsOpen;render();},
  collapseNav:function(){S.navCollapsed=true;document.getElementById("app").classList.remove("mobile-open");render();},
  next:function(){var i=WIZ.indexOf(navSel());go(WIZ[Math.min(i+1,WIZ.length-1)]);},
  back:function(){var i=WIZ.indexOf(navSel());go(WIZ[Math.max(i-1,0)]);},
  rate:function(el){el.disabled=true;el.innerHTML='<span class="spin"></span>Rate';setTimeout(function(){render();toast("Rating complete. Estimated annual premium $25,000.00");},1100);},
  save:function(){toast("Draft saved");},
  closeOpts:function(el){dropdown(el,["Withdraw Transaction","Decline","Not Taken"],function(t){toast(t+" is disabled in this playground");});},
  gmaps:function(){toast("Google Maps opens 713 E Paces Ferry Rd NE, Atlanta");},
  gmapsLoc:function(){toast("Google Maps opens "+LOCS[S.selLoc].addr);},
  fema:function(){toast("FEMA Flood Map opens for "+LOCS[S.selLoc].name+" (Zone "+LOCS[S.selLoc].fema+")");},
  changeTo:function(el){dropdown(el,["New Company","New Person","From Address Book","Existing Contact"],function(t){toast(t+" selected");});},
  addLoc:function(){toast("New location form opened");},
  addUW:function(){
    modal("Add UW Issue",
      '<div class="frow"><label for="uwT">Issue Type</label><div class="inp">'+sel(["High concern HazardHub factor","Convective storm exposure","Prior loss history","Manual referral"],"High concern HazardHub factor",true).replace("<select","<select id=\"uwT\"")+'</div></div>'+
      '<div class="frow"><label for="uwD">Short Description</label><div class="inp"><input id="uwD" value="Convective storm risk grade F at primary location"></div></div>'+
      '<div class="frow"><label for="uwB">Blocking Point</label><div class="inp">'+sel(["Bind","Quote","Issuance"],"Bind",true).replace("<select","<select id=\"uwB\"")+'</div></div>',
      "Add Issue",function(m){
        S.uwIssues.push({type:m.querySelector("#uwT").value,desc:m.querySelector("#uwD").value||"(no description)",block:m.querySelector("#uwB").value});
        S.raTab="UW Issues";render();toast("UW issue added");
      });
  },
  addCont:function(){toast("Add Contingency form opened");},
  reqApproval:function(){toast(S.uwIssues.length?"Approval requested for "+S.uwIssues.length+" issue(s)":"There are no UW issues to approve");},
  lock:function(){toast("Submission locked for review");}
};

document.addEventListener("click",function(e){
  var t=e.target;
  if(!t.closest(".dropdown")&&!t.closest("[data-menu]")&&!t.closest("[data-act='closeOpts']")&&!t.closest("[data-act='actions']")&&!t.closest("[data-act='changeTo']"))closeDrop();
  var el;
  if((el=t.closest("[data-menu]"))){
    var m=MENUS[+el.dataset.menu];
    if(!m[1]){toast(m[0]+" opened");return;}
    dropdown(el,m[1],function(x){toast(m[0]+" > "+x);});return;
  }
  if((el=t.closest("[data-nav]"))){go(el.dataset.nav);return;}
  if((el=t.closest("[data-act]"))&&ACTIONS[el.dataset.act]){ACTIONS[el.dataset.act](el);return;}
  if((el=t.closest("[data-ratab]"))){S.raTab=el.dataset.ratab;render();return;}
  if((el=t.closest("[data-loctab]"))){S.locTab=el.dataset.loctab;if(S.locTab==="primary")S.selLoc=0;render();return;}
  if((el=t.closest("[data-dettab]"))){S.detTab=el.dataset.dettab;render();return;}
  if((el=t.closest("[data-req]"))){e.stopPropagation();doRequest(el.dataset.req);return;}
  if((el=t.closest("[data-factor]"))){S.factor=el.dataset.factor;S.factorFrom=S.page;go("factorDetail");return;}
  if((el=t.closest("[data-sort]"))){sortBy(el.dataset.sort);return;}
  if((el=t.closest("tr[data-loc]"))){S.selLoc=+el.dataset.loc;render();return;}
  if((el=t.closest("[data-toast]"))){toast(el.dataset.toast);return;}
});
function sortBy(v){
  var p=v.split(":"),key=p[0]==="all"?"sortAll":"sortRel",cur=S[key];
  S[key] = cur&&cur.col===p[1] ? (cur.dir>0?{col:p[1],dir:-1}:null) : {col:p[1],dir:1};
  render();
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeDrop();var m=document.querySelector(".modal-bg");if(m)m.remove();}
  if((e.key==="Enter"||e.key===" ")){
    var el=e.target;
    if(el.matches("tr[data-loc]")){e.preventDefault();S.selLoc=+el.dataset.loc;render();}
    else if(el.matches("th[data-sort]")){e.preventDefault();sortBy(el.dataset.sort);}
  }
});
document.getElementById("expandNav").addEventListener("click",function(){
  if(window.innerWidth<=760)document.getElementById("app").classList.add("mobile-open");
  S.navCollapsed=false;render();
});
document.getElementById("goto").addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var q=this.value.toLowerCase();
  var hit=FACTORS.filter(function(x){return x.name.toLowerCase().indexOf(q)>-1&&x.link})[0];
  if(q.indexOf("risk")>-1&&!hit){go("riskAnalysis");}
  else if(q.indexOf("policy")>-1){go("policyInfo");}
  else if(hit){S.factor=hit.name;S.factorFrom="allFactors";go("factorDetail");}
  else toast("No match for \""+this.value+"\"");
});
document.getElementById("hintToggle").addEventListener("change",function(){document.body.classList.toggle("hints",this.checked);});
document.getElementById("resetBtn").addEventListener("click",function(){S=fresh();document.getElementById("app").classList.remove("mobile-open");render();toast("Playground reset");});

renderMenus();render();
})();
</script>
</body>
